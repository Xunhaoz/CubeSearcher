<style>
  :root {
    --bg: #f6f7f5; --card: #fff; --text: #1d2420; --muted: #6b746e; --line: #e3e7e4;
    --accent: #1f7a4d; --accent-soft: #e6f3ec; --warn: #b35c00; --warn-soft: #fdf1e3;
    --hi: #fff1a8; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --card: #1d2320; --text: #e7ece9; --muted: #98a29c; --line: #2e3632;
      --accent: #5cc58f; --accent-soft: #1d3a2b; --warn: #f0a04b; --warn-soft: #3a2a17;
      --hi: #5c5320; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 0 8px; }
  h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
  .status button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--line);

  .search { position: relative; padding-bottom: 10px; }
  .search input { width: 100%; font-size: 17px; padding: 12px 40px 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--text); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search .clear { position: absolute; right: 10px; top: 9px; border: 0; background: none; color: var(--muted);

  .opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); padding-bottom: 10px; }
  .opts label { cursor: pointer; user-select: none; }
  .nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .nav a { flex: none; font-size: 13px; text-decoration: none; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
  .nav a.off { opacity: .45; }
  main { padding: 16px 0 60px; }
  .msg { color: var(--muted); padding: 30px 0; text-align: center; }
  .err { color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }

  /* 搜尋結果 */
  .best { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
  .best b { color: var(--accent); }

  .row { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);

  .row .rate { flex: none; width: 92px; text-align: center; font-weight: 700; font-size: 20px; color: var(--accent);
    line-height: 1.2; padding-top: 2px; }
  .row .rate.small { font-size: 14px; }
  .row .rate.na { color: var(--muted); font-size: 13px; font-weight: 600; }
  .row .body { flex: 1; min-width: 0; }

  .row .path { font-size: 13px; color: var(--muted); }

  .row .detail { display: none; margin-top: 8px; font-size: 13px; color: var(--muted); white-space: pre-line;

  .row.open .detail { display: block; }
  mark { background: var(--hi); color: inherit; border-radius: 2px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px;

  /* 方案總覽 */
  .plan { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px;

  .plan > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .plan > summary::-webkit-details-marker { display: none; }
  .plan h2 { margin: 0; font-size: 19px; }
  .plan .prate { font-weight: 700; color: var(--accent); }
  .plan .period { font-size: 13px; color: var(--muted); margin-left: auto; }
  .plan .inner { padding: 0 18px 14px; }
  .plan .note { font-size: 13px; color: var(--warn); margin: -4px 0 10px; }
  .cat { margin: 12px 0; }
  .cat h3 { font-size: 14px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .cat h3 .r { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--bg); cursor: help; }
  .chip .r { color: var(--accent); font-weight: 600; margin-left: 4px; font-size: 12px; }
  .grp { font-size: 12px; color: var(--muted); width: 100%; margin-top: 4px; }
  .info { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
  .info b { color: var(--text); }
  .src { font-size: 12px; }
  .src a { color: var(--muted); }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }

  input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  /* 點商家跳出的說明面板（手機沒有 hover，所以用點的） */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card);
    border-radius: 16px 16px 0 0; max-height: 75vh; overflow-y: auto; padding: 8px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .2s ease, visibility .2s; box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    visibility: hidden; }
  .sheet.show { transform: none; visibility: visible; }
  .sheet-bg.show { display: block; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
  .sheet h4 { margin: 0 0 2px; font-size: 18px; }
  .sheet .sr { font-size: 26px; font-weight: 700; color: var(--accent); margin: 4px 0; }
  .sheet .sp { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .sheet .sd { font-size: 14px; white-space: pre-line; border-top: 1px solid var(--line); padding-top: 10px; }
  .sheet .close { position: sticky; top: 0; float: right; border: 0; background: var(--bg); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  @media (min-width: 701px) {
    .sheet { left: 50%; right: auto; width: 560px; margin-left: -280px; bottom: 50%; border-radius: 16px;
      transform: translateY(50%) scale(.96); opacity: 0; pointer-events: none; transition: .15s; }
    .sheet.show { transform: translateY(50%); opacity: 1; pointer-events: auto; }
  }

  /* ---------- 手機 ---------- */
  @media (max-width: 700px) {
    body { font-size: 15px; -webkit-text-size-adjust: 100%; }
    .wrap { padding: 0 12px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    header { padding-top: env(safe-area-inset-top); }
    .top { padding: 10px 0 6px; gap: 8px; }
    h1 { font-size: 16px; }
    .stat-full { display: none; }
    .stat-short { display: inline; }
    .status button { padding: 4px 8px; }
    .search { display: flex; gap: 8px; padding-bottom: 8px; }
    .search input { font-size: 16px; padding: 10px 36px 10px 12px; flex: 1; min-width: 0; } /* 16px 以上 iOS 才不會自動放大 */
    .search .clear { right: 62px; top: 6px; font-size: 22px; padding: 4px; }
    .filter-btn { display: block; flex: none; width: 50px; border: 1.5px solid var(--line); border-radius: 10px;
      background: var(--card); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    .filter-btn.on { border-color: var(--accent); color: var(--accent); }
    .opts { display: none; flex-direction: column; gap: 10px; font-size: 14px; padding: 4px 2px 12px; }
    .opts.show { display: flex; }
    .opts input { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }
    .nav { padding-bottom: 8px; margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
    .nav a { padding: 5px 12px; font-size: 14px; }
    main { padding-top: 12px; }

    .best { padding: 10px 12px; font-size: 14px; }
    .row { gap: 10px; padding: 10px 12px; border-radius: 12px; }
    .row .rate { width: 62px; font-size: 18px; }
    .row .rate.small { font-size: 13px; }
    .row .rate.na { font-size: 12px; }
    .row .name { font-size: 15px; }
    .row .path { font-size: 12px; }

    .plan { border-radius: 12px; margin-bottom: 12px; scroll-margin-top: 150px; }
    .plan > summary { padding: 12px 14px; gap: 6px 8px; }
    .plan h2 { font-size: 17px; }
    .plan .period { margin-left: 0; width: 100%; font-size: 12px; }
    .plan .inner { padding: 0 14px 12px; }
    .cat h3 { font-size: 14px; flex-wrap: wrap; }
    .chips { gap: 6px; }
    .chip { font-size: 13px; padding: 5px 9px; border-radius: 8px; } /* 加大觸控面積 */
  }
</style>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>CUBE 權益查詢</h1>
      <div class="status" id="status">載入中…</div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋商家，例如：星巴克、uber、百貨" autocomplete="off"
        enterkeyhint="search" autocapitalize="off" spellcheck="false">
      <button class="clear" id="clear" aria-label="清除">×</button>
      <button class="filter-btn" id="filterBtn" aria-expanded="false">篩選</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optActive" checked> 只顯示進行中的方案</label>
      <label><input type="checkbox" id="optRestricted" checked> 包含限定方案（Googler、童樂匯…）</label>
      <label><input type="checkbox" id="optDetail"> 也搜尋注意事項條文</label>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="msg">正在從國泰世華網站取得最新權益…</div></main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<footer>資料每小時自動取自 cathay-cube.com.tw，實際回饋以國泰世華官網公告與系統認列為準。</footer>

<script>
"use strict";
const SITE = "https://www.cathay-cube.com.tw/cathaybk/personal";
const SOURCES = {
  // data/*.json 由 GitHub Actions 每小時從官網抓一次（scripts/fetch.py）
  cube:    { api: "data/cube.json",    page: SITE + "/product/credit-card/cards/cube-list" },
  googler: { api: "data/googler.json", page: SITE + "/event/overview/segment/2026/googler_package" },
};

// 「3.5%」「3~5%」「3%~8%」「3.5%/10%」「1% / 5% / 10%」
const RATE_SRC = String.raw`\d+(?:\.\d+)?%?(?:\s*[~～]\s*\d+(?:\.\d+)?)?\s*%(?:\s*[\/／]\s*\d+(?:\.\d+)?\s*%)*`;
const RATE_IN = new RegExp(RATE_SRC);
const RATE_ONLY = new RegExp("^\\s*" + RATE_SRC + "\\s*$");

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function htmlToText(html) {
  if (!html) return "";
  const doc = new DOMParser().parseFromString(
    html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|li|tr|h\d|div)>/gi, "$&\n"), "text/html");
  return doc.body.textContent.replace(/ /g, " ").replace(/[ \t]+/g, " ")
    .split("\n").map(s => s.trim()).filter(Boolean).join("\n");
}
const oneLine = s => htmlToText(s).replace(/\n/g, " ").trim();
const cleanRate = r => r ? r.replace(/\s+/g, "").replace(/／/g, "/").replace(/～/g, "~") : "";
const maxRate = r => { const n = (r || "").match(/\d+(?:\.\d+)?/g); return n ? Math.max(...n.map(Number)) : -1; };

function parsePeriod(text) {
  const m = (text || "").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*[~～\-–]\s*(?:(\d{4})\/)?(\d{1,2})\/(\d{1,2})/);
  if (!m) return null;
  const start = new Date(+m[1], m[2] - 1, +m[3]);
  const end = new Date(+(m[4] || m[1]), m[5] - 1, +m[6], 23, 59, 59);
  return { start, end, label: `${m[1]}/${m[2]}/${m[3]} – ${m[4] || m[1]}/${m[5]}/${m[6]}` };
}
function periodStatus(p) {
  if (!p) return "unknown";
  const now = new Date();
  return now < p.start ? "upcoming" : now > p.end ? "ended" : "active";
}

// 以「、」或換行切開商家名，但不切括號裡的（例：MITSUI OUTLET PARK(林口、台中港、台南)）
function splitNames(text) {
  const out = []; let buf = "", depth = 0;
  for (const ch of text) {
    if ("(（".includes(ch)) depth++;
    if (")）".includes(ch)) depth = Math.max(0, depth - 1);
    if (depth === 0 && (ch === "、" || ch === "\n")) { if (buf.trim()) out.push(buf.trim()); buf = ""; }
    else buf += ch;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}

// 依序走訪 AEM model 的 :items
function* walk(node) {
  if (!node || typeof node !== "object") return;
  if (node[":type"]) yield node;
  const items = node[":items"];
  if (items) {
    const order = node[":itemsOrder"] || Object.keys(items);
    for (const k of order) yield* walk(items[k]);
  }
  if (node.experienceFragment) yield* walk(node.experienceFragment);
}

// ---------- 解析：CUBE 權益方案列表 ----------
function parseCubeList(model) {
  const plans = [];
  for (const node of walk(model)) {
    if (!node[":type"].endsWith("/cub-cubelisttitle")) continue;
    const mt = node.mainTitle || "";
    const doc = new DOMParser().parseFromString(mt, "text/html");
    const h3 = doc.querySelector("h3");
    const name = (h3 ? h3.textContent : oneLine(mt).slice(0, 12)).replace(/ /g, " ").trim();
    const period = parsePeriod(oneLine(mt).match(/適用期間[：:]?\s*([^\s]+)/)?.[1]);
    // 方案大標的回饋率：整段只有 % 的 <p>
    const planRate = [...doc.querySelectorAll("p")].map(p => p.textContent.trim()).find(t => RATE_ONLY.test(t)) || "";
    const noticeText = oneLine(node.paragraphNoticeContent || "");
    const noticeMax = noticeText.match(new RegExp(name + "\\s*最高\\s*(\\d+(?:\\.\\d+)?%)"))?.[1]
                   || noticeText.match(/最高\s*(\d+(?:\.\d+)?%)/)?.[1] || "";
    const singlePlanRate = planRate && !/[\/~～]/.test(planRate) ? cleanRate(planRate) : "";
    const fallback = singlePlanRate || (noticeMax ? `最高${noticeMax}` : "");

    const plan = {
      id: node.anchorKey || name, name, period, status: periodStatus(period),
      rate: cleanRate(planRate) || (noticeMax ? `最高${noticeMax}（依等級）` : "依權益等級"),
      source: SOURCES.cube.page + (node.anchorKey ? "#" + node.anchorKey : ""),
      // 從注意事項偵測資格限制，例如「「慶生月」權益方案限正卡人生日當月獨享切換」
      restricted: noticeText.match(/權益方案(限[^。，；]+)/)?.[1]
        || (/須符合以下\s*\d+\s*項條件/.test(noticeText) ? "需先符合解鎖條件（見方案說明）" : ""),
      categories: [], infos: [],
    };

    for (const c of Object.values(node[":items"] || {})) {
      const rawCat = oneLine(c.categoryName || "");
      const catRate = cleanRate(rawCat.match(RATE_IN)?.[0] || "");
      const catName = rawCat.replace(RATE_IN, "").trim() || rawCat;
      const items = [];
      for (const grp of c.contentTrees || []) {
        const ct = grp.contentTrees || {};
        Object.keys(ct).filter(k => /^item\d+$/.test(k)).sort((a, b) => a.slice(4) - b.slice(4))
          .forEach(k => items.push(ct[k]));
      }
      // 「慶生月活動」「如何解鎖童樂匯？」這類說明區塊不是商家
      if (!catRate && /活動|如何|解鎖/.test(catName)) {
        plan.infos.push({ title: catName, lines: items.map(i => oneLine(i.itemText)).filter(Boolean) });
        continue;
      }
      const cat = { name: catName, rate: catRate || fallback, merchants: [] };
      let subRate = "", group = "";
      for (const it of items) {
        const t = oneLine(it.itemText);
        if (!t) continue;
        if (RATE_ONLY.test(t)) { subRate = cleanRate(t); continue; }       // 例：「5%」小標
        if (/[：:]$/.test(t)) { group = t.replace(/[：:]$/, ""); continue; } // 例：「IP專賣店：」小標
        cat.merchants.push({ name: t, rate: subRate || catRate || fallback, group, detail: htmlToText(it.itemContent) });
      }
      if (cat.merchants.length) plan.categories.push(cat);
    }
    plans.push(plan);
  }
  return plans;
}

// ---------- 解析：Googler 專屬方案 ----------
function parseGoogler(model) {
  let table = null, planName = "Googler", allText = "";
  for (const node of walk(model)) {
    const html = node.text || "";
    allText += "\n" + htmlToText(html);
    if (!table && /權益方案/.test(html) && /<table/i.test(html)) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const inner = doc.querySelector("table table") || doc.querySelector("table");
      if (inner) { table = inner; planName = doc.body.textContent.match(/「([^」]+)」專屬/)?.[1] || planName; }
    }
  }
  if (!table) throw new Error("找不到 Googler 權益表格（網頁版型可能改了）");
  const period = parsePeriod(allText.match(/權益方案適用期間[：:]?\s*([\d\/]+\s*[~～\-]\s*[\d\/]+)/)?.[1]);
  const plan = {
    id: "googler", name: planName, period, status: periodStatus(period), rate: "",
    source: SOURCES.googler.page, restricted: "限 Google 臺灣區正式員工薪轉戶",
    categories: [], infos: [],
  };
  for (const tr of table.querySelectorAll("tr")) {
    const tds = tr.querySelectorAll("td");
    if (tds.length < 2) continue;
    const head = tds[0].textContent.replace(/\s+/g, " ").trim();
    const rate = cleanRate(head.match(RATE_IN)?.[0] || "");
    const names = splitNames(htmlToText(tds[1].innerHTML).normalize("NFKC"));
    plan.categories.push({
      name: head.replace(RATE_IN, "").trim(), rate,
      merchants: names.map(n => ({ name: n, rate, group: "", detail: "" })),
    });
  }
  const rates = [...new Set(plan.categories.map(c => c.rate).filter(Boolean))].sort((a, b) => maxRate(a) - maxRate(b));
  plan.rate = rates.join(" / ");
  return [plan];
}

// ---------- 模糊搜尋 ----------
const norm = s => (s || "").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");

function fuzzy(q, s) {
  if (!q || !s) return 0;
  const i = s.indexOf(q);
  if (i >= 0) return 100 - Math.min(i, 20) + (s === q ? 20 : 0);
  // 依序出現（允許中間夾字），字越緊湊分數越高。
  // 只對含中文的查詢這樣做：英文字母依序出現太容易誤中（uber → yo-u-tu-b-e-premium）
  if (!/\p{Script=Han}/u.test(q)) return 0;
  let best = 0;
  for (let start = s.indexOf(q[0]); start >= 0; start = s.indexOf(q[0], start + 1)) {
    let pos = start, ok = true;
    for (let k = 1; k < q.length; k++) {
      pos = s.indexOf(q[k], pos + 1);
      if (pos < 0) { ok = false; break; }
    }
    if (!ok) break;
    const span = pos - start + 1;
    if (span <= q.length * 2 + 1) best = Math.max(best, 60 * q.length / span);
  }
  return best;
}

let PLANS = [], INDEX = [], CHIPS = [];
function buildIndex() {
  INDEX = [];
  for (const p of PLANS) for (const c of p.categories) for (const m of c.merchants) {
    INDEX.push({
      plan: p, cat: c, m,
      f: { name: norm(m.name), group: norm(m.group), cat: norm(c.name), plan: norm(p.name), detail: norm(m.detail) },
    });
  }
}

function search(query, withDetail) {
  const tokens = query.trim().split(/\s+/).map(norm).filter(Boolean);
  if (!tokens.length) return [];
  const out = [];
  for (const e of INDEX) {
    let total = 0;
    for (const t of tokens) {
      const s = Math.max(
        fuzzy(t, e.f.name),
        fuzzy(t, e.f.group) * 0.7,
        fuzzy(t, e.f.cat) * 0.7,
        fuzzy(t, e.f.plan) * 0.6,
        withDetail && e.f.detail.includes(t) ? 30 : 0,
      );
      if (s < 25) { total = 0; break; }
      total += s;
    }
    if (total > 0) out.push({ ...e, score: total });
  }
  return out;
}

// ---------- 畫面 ----------
function hl(text, query) {
  let html = esc(text);
  const terms = query.trim().split(/\s+/).filter(Boolean).sort((a, b) => b.length - a.length);
  for (const t of terms) {
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  return html;
}
const statusTag = p => p.status === "upcoming" ? `<span class="tag">未開始</span>`
  : p.status === "ended" ? `<span class="tag">已結束</span>` : "";
const restrictTag = p => p.restricted ? `<span class="tag" title="${esc(p.restricted)}">限定</span>` : "";

function visiblePlans() {
  return PLANS.filter(p => (!$("#optActive").checked || p.status !== "ended")
                        && ($("#optRestricted").checked || !p.restricted));
}

function rateBox(rate) {
  if (!rate || maxRate(rate) < 0) return `<div class="rate na">${esc(rate || "依等級")}</div>`;
  return `<div class="rate${rate.length > 6 ? " small" : ""}">${esc(rate)}</div>`;
}

function renderResults(query) {
  const allowed = new Set(visiblePlans());
  const res = search(query, $("#optDetail").checked).filter(r => allowed.has(r.plan));
  res.sort((a, b) => maxRate(b.m.rate) - maxRate(a.m.rate) || b.score - a.score);
  if (!res.length) return `<div class="msg">找不到「${esc(query)}」。沒有列在任何方案的商家，通常只適用一般消費 0.3%。</div>`;

  // 依方案找出最高回饋，當作建議
  const top = res[0];
  const plansHit = [...new Set(res.map(r => r.plan.name))];
  let html = `<div class="best">要刷「<b>${esc(top.m.name)}</b>」，建議切換到 <b>${esc(top.plan.name)}</b>`
    + (maxRate(top.m.rate) >= 0 ? `，回饋 <b>${esc(top.m.rate)}</b>` : "")
    + `${top.plan.restricted ? `（${esc(top.plan.restricted)}）` : ""}。`
    + (() => {
        if (!top.plan.restricted) return "";
        const open = res.find(r => !r.plan.restricted);
        return open ? `<br>不符合資格的話：<b>${esc(open.plan.name)}</b> ${esc(open.m.rate)}（${esc(open.m.name)}）`
                    : `<br>不符合資格的話：沒有其他方案列出這家，只有一般消費 0.3%。`;
      })()
    + (plansHit.length > 1 ? `<br><span style="font-size:13px">其他也有優惠的方案：${plansHit.filter(n => n !== top.plan.name).map(esc).join("、")}</span>` : "")
    + `</div><p class="count">共 ${res.length} 筆，依回饋率排序；點一下看適用條件</p>`;
  for (const r of res.slice(0, 200)) {
    const p = r.plan;
    html += `<div class="row">${rateBox(r.m.rate)}<div class="body">
      <div class="name">${hl(r.m.name, query)}${restrictTag(p)}${statusTag(p)}</div>
      <div class="path"><span class="plan">${hl(p.name, query)}</span> › ${hl(r.cat.name, query)}${r.m.group ? " · " + hl(r.m.group, query) : ""}
        ${p.period ? ` · ${esc(p.period.label)}` : ""}</div>
      <div class="detail">${r.m.detail ? esc(r.m.detail) : "（此商家沒有額外說明）"}
${p.restricted ? "\n資格：" + esc(p.restricted) : ""}
<span class="src"><a href="${esc(p.source)}" target="_blank" rel="noopener">查看官網原文 ↗</a></span></div>
    </div></div>`;
  }
  return html;
}

function renderPlans() {
  const plans = visiblePlans();
  CHIPS = [];
  if (!plans.length) return `<div class="msg">沒有符合篩選條件的方案。</div>`;
  return plans.map(p => `
    <details class="plan${p.status === "ended" ? " ended" : ""}" id="plan-${esc(p.id)}" open>
      <summary><h2>${esc(p.name)}</h2><span class="prate">${esc(p.rate)}</span>${restrictTag(p)}${statusTag(p)}
        <span class="period">${p.period ? esc(p.period.label) : ""}</span></summary>
      <div class="inner">
        ${p.restricted ? `<div class="note">資格：${esc(p.restricted)}</div>` : ""}
        ${p.infos.map(i => `<div class="info"><b>${esc(i.title)}</b><br>${i.lines.map(esc).join("<br>")}</div>`).join("")}
        ${p.categories.map(c => {
          let lastGroup = "";
          const chips = c.merchants.map(m => {
            const g = m.group && m.group !== lastGroup ? `<div class="grp">${esc(m.group)}</div>` : "";
            lastGroup = m.group;
            const r = m.rate && m.rate !== c.rate ? `<span class="r">${esc(m.rate)}</span>` : "";
            CHIPS.push({ plan: p, cat: c, m });
            return g + `<button type="button" class="chip" data-k="${CHIPS.length - 1}">${esc(m.name)}${r}</button>`;
          }).join("");
          return `<div class="cat"><h3>${esc(c.name)}<span class="r">${esc(c.rate)}</span></h3><div class="chips">${chips}</div></div>`;
        }).join("")}
        <div class="src"><a href="${esc(p.source)}" target="_blank" rel="noopener">官網原文 ↗</a></div>
      </div>
    </details>`).join("");
}

function render() {
  const q = $("#q").value;
  $("#clear").style.display = q ? "block" : "none";
  const shown = new Set(visiblePlans());
  $("#nav").innerHTML = PLANS.map(p =>
    `<a href="#plan-${esc(p.id)}" class="${shown.has(p) ? "" : "off"}" data-plan="${esc(p.name)}">${esc(p.name)}</a>`).join("");
  $("#nav").hidden = !!q.trim();
  $("#main").innerHTML = (window.ERRORS || "") + (q.trim() ? renderResults(q) : renderPlans());
  const url = new URL(location); q.trim() ? url.searchParams.set("q", q) : url.searchParams.delete("q");
  history.replaceState(null, "", url);
}

// ---------- 載入 ----------
const STALE_HOURS = 6; // 資料超過這麼久沒更新就提醒（排程可能壞了）

async function load(force) {
  $("#status").textContent = "載入中…";
  const bust = force ? `?t=${Date.now()}` : "";
  const getJSON = async url => {
    const r = await fetch(url + bust, { cache: force ? "no-store" : "default" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  const meta = await getJSON("data/meta.json").catch(() => null);
  const sources = [["cube", "CUBE 權益方案", parseCubeList], ["googler", "Googler 專屬方案", parseGoogler]];
  const results = await Promise.allSettled(sources.map(([key, , parse]) => getJSON(SOURCES[key].api).then(parse)));

  PLANS = []; let errors = "";
  results.forEach((r, i) => {
    const [key, label] = sources[i];
    if (r.status === "fulfilled") PLANS.push(...r.value);
    else errors += `<div class="err">${label} 載入失敗：${esc(r.reason.message || r.reason)}</div>`;
    const m = meta?.sources?.[key];
    if (m && !m.ok) errors += `<div class="err">${label} 最近一次從官網更新失敗，顯示的是上一次成功的資料（${esc(m.error)}）</div>`;
  });
  const d = meta?.fetched_at ? new Date(meta.fetched_at) : null;
  if (d && Date.now() - d > STALE_HOURS * 3600e3)
    errors += `<div class="err">資料已經 ${Math.round((Date.now() - d) / 3600e3)} 小時沒更新，自動更新可能停了。</div>`;
  window.ERRORS = errors;
  buildIndex();
  const n = INDEX.length;
  const fmt = d ? d.toLocaleString("zh-TW", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  $("#status").innerHTML =
    `<span class="stat-full">${PLANS.length} 個方案・${n} 筆商家<br>官網資料更新於 ${fmt}</span>`
    + `<span class="stat-short">${n} 筆・${fmt}</span>`
    + `<button id="refresh" aria-label="重新載入">↻<span class="stat-full"> 重新載入</span></button>`;
  $("#refresh").onclick = () => load(true);
  render();
}

let timer;
$("#q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => { render(); window.scrollTo(0, 0); }, 80);
});
$("#clear").onclick = () => { $("#q").value = ""; render(); $("#q").focus(); };
["#optActive", "#optRestricted", "#optDetail"].forEach(s => $(s).addEventListener("change", render));
$("#main").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row && !e.target.closest("a")) row.classList.toggle("open");
});
$("#nav").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a || !$("#q").value) return;
  e.preventDefault(); $("#q").value = ""; render();       // 搜尋中點方案 → 回到總覽並跳過去
  document.querySelector(a.getAttribute("href"))?.scrollIntoView();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); }
});
// 商家說明面板
function openSheet({ plan: p, cat: c, m }) {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="close" aria-label="關閉">×</button>
    <h4>${esc(m.name)}</h4>
    <div class="sr">${esc(m.rate || "依等級")}</div>
    <div class="sp"><b>${esc(p.name)}</b> › ${esc(c.name)}${m.group ? " · " + esc(m.group) : ""}${p.period ? "<br>" + esc(p.period.label) : ""}
      ${p.restricted ? `<br><span style="color:var(--warn)">資格：${esc(p.restricted)}</span>` : ""}</div>
    <div class="sd">${m.detail ? esc(m.detail) : "（此商家沒有額外說明）"}</div>
    <p class="src"><a href="${esc(p.source)}" target="_blank" rel="noopener">查看官網原文 ↗</a></p>`;
  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("show"); $("#sheetBg").classList.add("show");
}
function closeSheet() { $("#sheet").classList.remove("show"); $("#sheetBg").classList.remove("show"); }
$("#sheetBg").onclick = closeSheet;
$("#sheet").addEventListener("click", e => { if (e.target.closest(".close")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#main").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) openSheet(CHIPS[+chip.dataset.k]);
});
// 往下滑可以關閉面板
let touchY = null;
$("#sheet").addEventListener("touchstart", e => { touchY = $("#sheet").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("#sheet").addEventListener("touchend", e => {
  if (touchY !== null && e.changedTouches[0].clientY - touchY > 80) closeSheet();
  touchY = null;
});

// 手機：篩選收合、按「搜尋」收鍵盤
$("#filterBtn").onclick = () => {
  const on = $(".opts").classList.toggle("show");
  $("#filterBtn").classList.toggle("on", on);
  $("#filterBtn").setAttribute("aria-expanded", on);
};
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") $("#q").blur(); });
// 只有桌機自動聚焦搜尋框；手機一開就跳鍵盤會擋住內容
if (matchMedia("(pointer: fine)").matches) $("#q").focus();

$("#q").value = new URL(location).searchParams.get("q") || "";
load(false);
</script>
