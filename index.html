<script>
"use strict";
const SITE = "https://www.cathay-cube.com.tw/cathaybk/personal";
const SOURCES = {
  // data/*.json 由 GitHub Actions 每小時從官網抓一次（scripts/fetch.py）
  cube:    { api: "data/cube.json",    page: SITE + "/product/credit-card/cards/cube-list" },
  googler: { api: "data/googler.json", page: SITE + "/event/overview/segment/2026/googler_package" },
};

// 「3.5%」「3~5%」「3%~8%」「3.5%/10%」「1% / 5% / 10%」
const RATE_SRC = String.raw`\d+(?:\.\d+)?%?(?:\s*[~～]\s*\d+(?:\.\d+)?)?\s*%(?:\s*[\/／]\s*\d+(?:\.\d+)?\s*%)*`;
const RATE_IN = new RegExp(RATE_SRC);
const RATE_ONLY = new RegExp("^\\s*" + RATE_SRC + "\\s*$");

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function htmlToText(html) {
  if (!html) return "";
  const doc = new DOMParser().parseFromString(
    html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|li|tr|h\d|div)>/gi, "$&\n"), "text/html");
  return doc.body.textContent.replace(/ /g, " ").replace(/[ \t]+/g, " ")
    .split("\n").map(s => s.trim()).filter(Boolean).join("\n");
}
const oneLine = s => htmlToText(s).replace(/\n/g, " ").trim();
const cleanRate = r => r ? r.replace(/\s+/g, "").replace(/／/g, "/").replace(/～/g, "~") : "";
const maxRate = r => { const n = (r || "").match(/\d+(?:\.\d+)?/g); return n ? Math.max(...n.map(Number)) : -1; };

function parsePeriod(text) {
  const m = (text || "").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*[~～\-–]\s*(?:(\d{4})\/)?(\d{1,2})\/(\d{1,2})/);
  if (!m) return null;
  const start = new Date(+m[1], m[2] - 1, +m[3]);
  const end = new Date(+(m[4] || m[1]), m[5] - 1, +m[6], 23, 59, 59);
  return { start, end, label: `${m[1]}/${m[2]}/${m[3]} – ${m[4] || m[1]}/${m[5]}/${m[6]}` };
}
function periodStatus(p) {
  if (!p) return "unknown";
  const now = new Date();
  return now < p.start ? "upcoming" : now > p.end ? "ended" : "active";
}

// 以「、」或換行切開商家名，但不切括號裡的（例：MITSUI OUTLET PARK(林口、台中港、台南)）
function splitNames(text) {
  const out = []; let buf = "", depth = 0;
  for (const ch of text) {
    if ("(（".includes(ch)) depth++;
    if (")）".includes(ch)) depth = Math.max(0, depth - 1);
    if (depth === 0 && (ch === "、" || ch === "\n")) { if (buf.trim()) out.push(buf.trim()); buf = ""; }
    else buf += ch;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}

// 依序走訪 AEM model 的 :items
function* walk(node) {
  if (!node || typeof node !== "object") return;
  if (node[":type"]) yield node;
  const items = node[":items"];
  if (items) {
    const order = node[":itemsOrder"] || Object.keys(items);
    for (const k of order) yield* walk(items[k]);
  }
  if (node.experienceFragment) yield* walk(node.experienceFragment);
}

// ---------- 解析：CUBE 權益方案列表 ----------
function parseCubeList(model) {
  const plans = [];
  for (const node of walk(model)) {
    if (!node[":type"].endsWith("/cub-cubelisttitle")) continue;
    const mt = node.mainTitle || "";
    const doc = new DOMParser().parseFromString(mt, "text/html");
    const h3 = doc.querySelector("h3");
    const name = (h3 ? h3.textContent : oneLine(mt).slice(0, 12)).replace(/ /g, " ").trim();
    const period = parsePeriod(oneLine(mt).match(/適用期間[：:]?\s*([^\s]+)/)?.[1]);
    // 方案大標的回饋率：整段只有 % 的 <p>
    const planRate = [...doc.querySelectorAll("p")].map(p => p.textContent.trim()).find(t => RATE_ONLY.test(t)) || "";
    const noticeText = oneLine(node.paragraphNoticeContent || "");
    const noticeMax = noticeText.match(new RegExp(name + "\\s*最高\\s*(\\d+(?:\\.\\d+)?%)"))?.[1]
                   || noticeText.match(/最高\s*(\d+(?:\.\d+)?%)/)?.[1] || "";
    const singlePlanRate = planRate && !/[\/~～]/.test(planRate) ? cleanRate(planRate) : "";
    const fallback = singlePlanRate || (noticeMax ? `最高${noticeMax}` : "");

    const plan = {
      id: node.anchorKey || name, name, period, status: periodStatus(period),
      rate: cleanRate(planRate) || (noticeMax ? `最高${noticeMax}（依等級）` : "依權益等級"),
      source: SOURCES.cube.page + (node.anchorKey ? "#" + node.anchorKey : ""),
      // 從注意事項偵測資格限制，例如「「慶生月」權益方案限正卡人生日當月獨享切換」
      restricted: noticeText.match(/權益方案(限[^。，；]+)/)?.[1]
        || (/須符合以下\s*\d+\s*項條件/.test(noticeText) ? "需先符合解鎖條件（見方案說明）" : ""),
      categories: [], infos: [],
    };

    for (const c of Object.values(node[":items"] || {})) {
      const rawCat = oneLine(c.categoryName || "");
      const catRate = cleanRate(rawCat.match(RATE_IN)?.[0] || "");
      const catName = rawCat.replace(RATE_IN, "").trim() || rawCat;
      const items = [];
      for (const grp of c.contentTrees || []) {
        const ct = grp.contentTrees || {};
        Object.keys(ct).filter(k => /^item\d+$/.test(k)).sort((a, b) => a.slice(4) - b.slice(4))
          .forEach(k => items.push(ct[k]));
      }
      // 「慶生月活動」「如何解鎖童樂匯？」這類說明區塊不是商家
      if (!catRate && /活動|如何|解鎖/.test(catName)) {
        plan.infos.push({ title: catName, lines: items.map(i => oneLine(i.itemText)).filter(Boolean) });
        continue;
      }
      const cat = { name: catName, rate: catRate || fallback, merchants: [] };
      let subRate = "", group = "";
      for (const it of items) {
        const t = oneLine(it.itemText);
        if (!t) continue;
        if (RATE_ONLY.test(t)) { subRate = cleanRate(t); continue; }       // 例：「5%」小標
        if (/[：:]$/.test(t)) { group = t.replace(/[：:]$/, ""); continue; } // 例：「IP專賣店：」小標
        cat.merchants.push({ name: t, rate: subRate || catRate || fallback, group, detail: htmlToText(it.itemContent) });
      }
      if (cat.merchants.length) plan.categories.push(cat);
    }
    plans.push(plan);
  }
  return plans;
}

// ---------- 解析：Googler 專屬方案 ----------
function parseGoogler(model) {
  let table = null, planName = "Googler", allText = "";
  for (const node of walk(model)) {
    const html = node.text || "";
    allText += "\n" + htmlToText(html);
    if (!table && /權益方案/.test(html) && /<table/i.test(html)) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const inner = doc.querySelector("table table") || doc.querySelector("table");
      if (inner) { table = inner; planName = doc.body.textContent.match(/「([^」]+)」專屬/)?.[1] || planName; }
    }
  }
  if (!table) throw new Error("找不到 Googler 權益表格（網頁版型可能改了）");
  const period = parsePeriod(allText.match(/權益方案適用期間[：:]?\s*([\d\/]+\s*[~～\-]\s*[\d\/]+)/)?.[1]);
  const plan = {
    id: "googler", name: planName, period, status: periodStatus(period), rate: "",
    source: SOURCES.googler.page, restricted: "限 Google 臺灣區正式員工薪轉戶",
    categories: [], infos: [],
  };
  for (const tr of table.querySelectorAll("tr")) {
    const tds = tr.querySelectorAll("td");
    if (tds.length < 2) continue;
    const head = tds[0].textContent.replace(/\s+/g, " ").trim();
    const rate = cleanRate(head.match(RATE_IN)?.[0] || "");
    const names = splitNames(htmlToText(tds[1].innerHTML).normalize("NFKC"));
    plan.categories.push({
      name: head.replace(RATE_IN, "").trim(), rate,
      merchants: names.map(n => ({ name: n, rate, group: "", detail: "" })),
    });
  }
  const rates = [...new Set(plan.categories.map(c => c.rate).filter(Boolean))].sort((a, b) => maxRate(a) - maxRate(b));
  plan.rate = rates.join(" / ");
  return [plan];
}

// ---------- 模糊搜尋 ----------
const norm = s => (s || "").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");

function fuzzy(q, s) {
  if (!q || !s) return 0;
  const i = s.indexOf(q);
  if (i >= 0) return 100 - Math.min(i, 20) + (s === q ? 20 : 0);
  // 依序出現（允許中間夾字），字越緊湊分數越高。
  // 只對含中文的查詢這樣做：英文字母依序出現太容易誤中（uber → yo-u-tu-b-e-premium）
  if (!/\p{Script=Han}/u.test(q)) return 0;
  let best = 0;
  for (let start = s.indexOf(q[0]); start >= 0; start = s.indexOf(q[0], start + 1)) {
    let pos = start, ok = true;
    for (let k = 1; k < q.length; k++) {
      pos = s.indexOf(q[k], pos + 1);
      if (pos < 0) { ok = false; break; }
    }
    if (!ok) break;
    const span = pos - start + 1;
    if (span <= q.length * 2 + 1) best = Math.max(best, 60 * q.length / span);
  }
  return best;
}

let PLANS = [], INDEX = [], CHIPS = [];
function buildIndex() {
  INDEX = [];
  for (const p of PLANS) for (const c of p.categories) for (const m of c.merchants) {
    INDEX.push({
      plan: p, cat: c, m,
      f: { name: norm(m.name), group: norm(m.group), cat: norm(c.name), plan: norm(p.name), detail: norm(m.detail) },
    });
  }
}

function search(query, withDetail) {
  const tokens = query.trim().split(/\s+/).map(norm).filter(Boolean);
  if (!tokens.length) return [];
  const out = [];
  for (const e of INDEX) {
    let total = 0;
    for (const t of tokens) {
      const s = Math.max(
        fuzzy(t, e.f.name),
        fuzzy(t, e.f.group) * 0.7,
        fuzzy(t, e.f.cat) * 0.7,
        fuzzy(t, e.f.plan) * 0.6,
        withDetail && e.f.detail.includes(t) ? 30 : 0,
      );
      if (s < 25) { total = 0; break; }
      total += s;
    }
    if (total > 0) out.push({ ...e, score: total });
  }
  return out;
}

// ---------- 畫面 ----------
const svg = (d, size = 16, cls = "") => `<svg class="${cls}" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  chevron: '<path d="m6 9 6 6 6-6"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  sparkles: '<path d="M9.94 14.06 4 20"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/><circle cx="12" cy="12" r="4"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
};
const srcLink = (href, label = "查看官網原文") =>
  `<a href="${esc(href)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs text-muted-foreground underline-offset-4 hover:text-foreground hover:underline">${label}${svg(ICON.external, 12)}</a>`;
const emptyMsg = html => `<div class="py-16 text-center text-sm text-muted-foreground">${html}</div>`;

function hl(text, query) {
  let html = esc(text);
  const terms = query.trim().split(/\s+/).filter(Boolean).sort((a, b) => b.length - a.length);
  for (const t of terms) {
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  return html;
}
const statusTag = p => p.status === "upcoming" ? `<span class="badge" data-variant="secondary">未開始</span>`
  : p.status === "ended" ? `<span class="badge" data-variant="secondary">已結束</span>` : "";
const restrictTag = p => p.restricted
  ? `<span class="badge border-warn/40 text-warn" data-variant="outline" title="${esc(p.restricted)}">${svg(ICON.lock, 11)}限定</span>` : "";

function visiblePlans() {
  return PLANS.filter(p => (!$("#optActive").checked || p.status !== "ended")
                        && ($("#optRestricted").checked || !p.restricted));
}

function rateBox(rate) {
  const base = "flex w-16 shrink-0 items-center justify-center self-start min-h-14 rounded-lg px-1 py-2 text-center leading-tight sm:w-24";
  if (!rate || maxRate(rate) < 0)
    return `<div class="${base} bg-muted text-xs font-medium text-muted-foreground">${esc(rate || "依等級")}</div>`;
  const size = rate.length > 6 ? "text-sm" : "text-lg sm:text-xl";
  return `<div class="${base} bg-primary/10 ${size} font-bold tabular-nums text-primary">${esc(rate)}</div>`;
}

function renderResults(query) {
  const allowed = new Set(visiblePlans());
  const res = search(query, $("#optDetail").checked).filter(r => allowed.has(r.plan));
  res.sort((a, b) => maxRate(b.m.rate) - maxRate(a.m.rate) || b.score - a.score);
  if (!res.length) return emptyMsg(`找不到「<span class="font-medium text-foreground">${esc(query)}</span>」<br>沒有列在任何方案的商家，通常只適用一般消費 0.3%。`);

  // 依方案找出最高回饋，當作建議
  const top = res[0];
  const plansHit = [...new Set(res.map(r => r.plan.name))];
  const hasRate = maxRate(top.m.rate) >= 0;
  let fallback = "";
  if (top.plan.restricted) {
    const open = res.find(r => !r.plan.restricted);
    fallback = open
      ? `不符合資格的話：<b class="text-foreground">${esc(open.plan.name)}</b> ${esc(open.m.rate)}（${esc(open.m.name)}）`
      : `不符合資格的話：沒有其他方案列出這家，只有一般消費 0.3%。`;
  }
  const others = plansHit.filter(n => n !== top.plan.name);

  let html = `
    <section class="mb-5 overflow-hidden rounded-xl border border-primary/25 bg-primary/5">
      <div class="flex items-start gap-4 p-4 sm:p-5">
        <div class="min-w-0 flex-1">
          <div class="mb-1.5 flex items-center gap-1.5 text-xs font-medium text-primary">${svg(ICON.sparkles, 14)}建議方案</div>
          <p class="text-[15px] leading-relaxed">要刷「<b>${esc(top.m.name)}</b>」，切換到
            <b class="text-primary">${esc(top.plan.name)}</b>${top.plan.restricted ? `<span class="text-sm text-muted-foreground">（${esc(top.plan.restricted)}）</span>` : ""}</p>
          ${fallback ? `<p class="mt-1 text-sm text-muted-foreground">${fallback}</p>` : ""}
          ${others.length ? `<p class="mt-2 text-xs text-muted-foreground">其他也有優惠的方案：${others.map(esc).join("、")}</p>` : ""}
        </div>
        ${hasRate ? `<div class="shrink-0 text-right"><div class="text-2xl font-bold tabular-nums text-primary sm:text-3xl">${esc(top.m.rate)}</div><div class="text-xs text-muted-foreground">回饋</div></div>` : ""}
      </div>
    </section>
    <p class="mb-2 px-1 text-xs text-muted-foreground">共 ${res.length} 筆，依回饋率排序 · 點一下看適用條件</p>
    <div class="flex flex-col gap-2">`;
  for (const r of res.slice(0, 200)) {
    const p = r.plan;
    html += `<div class="row group flex cursor-pointer gap-3 rounded-xl border bg-card p-2.5 shadow-xs transition-colors hover:border-primary/30 sm:gap-4 sm:p-3">
      ${rateBox(r.m.rate)}
      <div class="min-w-0 flex-1 py-0.5">
        <div class="flex items-start gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5 font-medium leading-snug">${hl(r.m.name, query)}${restrictTag(p)}${statusTag(p)}</div>
            <div class="mt-0.5 text-xs leading-relaxed text-muted-foreground"><span class="font-medium text-foreground/80">${hl(p.name, query)}</span> › ${hl(r.cat.name, query)}${r.m.group ? " · " + hl(r.m.group, query) : ""}${p.period ? ` · ${esc(p.period.label)}` : ""}</div>
          </div>
          ${svg(ICON.chevron, 16, "mt-0.5 shrink-0 text-muted-foreground transition-transform group-[.open]:rotate-180")}
        </div>
        <div class="mt-2.5 hidden border-t border-dashed pt-2.5 text-[13px] leading-relaxed text-muted-foreground group-[.open]:block">
          <div class="whitespace-pre-line">${r.m.detail ? esc(r.m.detail) : "（此商家沒有額外說明）"}</div>
          ${p.restricted ? `<div class="mt-2 text-warn">資格：${esc(p.restricted)}</div>` : ""}
          <div class="mt-2">${srcLink(p.source)}</div>
        </div>
      </div>
    </div>`;
  }
  return html + `</div>`;
}

function renderPlans() {
  const plans = visiblePlans();
  CHIPS = [];
  if (!plans.length) return emptyMsg("沒有符合篩選條件的方案。");
  return `<div class="flex flex-col gap-4">` + plans.map(p => `
    <details class="group/plan scroll-mt-52 overflow-hidden rounded-xl border bg-card text-card-foreground shadow-xs ${p.status === "ended" ? "opacity-60" : ""}" id="plan-${esc(p.id)}" open>
      <summary class="flex cursor-pointer select-none flex-wrap items-center gap-x-2.5 gap-y-1.5 px-4 py-3.5 transition-colors hover:bg-muted/40 sm:px-5">
        <h2 class="text-lg font-semibold tracking-tight">${esc(p.name)}</h2>
        ${p.rate ? `<span class="badge">${esc(p.rate)}</span>` : ""}${restrictTag(p)}${statusTag(p)}
        <span class="ml-auto flex items-center gap-2 text-xs text-muted-foreground">
          ${p.period ? esc(p.period.label) : ""}
          ${svg(ICON.chevron, 16, "transition-transform group-open/plan:rotate-180")}
        </span>
      </summary>
      <div class="flex flex-col gap-5 border-t px-4 py-4 sm:px-5">
        ${p.restricted ? `<div class="flex items-start gap-2 text-sm text-warn">${svg(ICON.lock, 15, "mt-0.5 shrink-0")}<span>資格：${esc(p.restricted)}</span></div>` : ""}
        ${p.infos.map(i => `<div class="flex gap-2.5 rounded-lg bg-muted/60 p-3 text-[13px] leading-relaxed text-muted-foreground">${svg(ICON.info, 15, "mt-0.5 shrink-0")}<div><div class="mb-0.5 font-medium text-foreground">${esc(i.title)}</div>${i.lines.map(esc).join("<br>")}</div></div>`).join("")}
        ${p.categories.map(c => {
          let lastGroup = "";
          const chips = c.merchants.map(m => {
            const g = m.group && m.group !== lastGroup ? `<div class="mt-1.5 w-full text-xs font-medium text-muted-foreground first:mt-0">${esc(m.group)}</div>` : "";
            lastGroup = m.group;
            const r = m.rate && m.rate !== c.rate ? `<span class="text-xs font-semibold text-primary">${esc(m.rate)}</span>` : "";
            CHIPS.push({ plan: p, cat: c, m });
            return g + `<button type="button" class="chip inline-flex items-center gap-1.5 rounded-md border bg-background px-2.5 py-1.5 text-left text-[13px] leading-snug transition-colors hover:border-primary/40 hover:bg-primary/5 sm:py-1" data-k="${CHIPS.length - 1}">${esc(m.name)}${r}</button>`;
          }).join("");
          return `<div><h3 class="mb-2 flex flex-wrap items-baseline gap-2 text-sm font-medium">${esc(c.name)}<span class="font-semibold text-primary">${esc(c.rate)}</span><span class="text-xs font-normal text-muted-foreground">${c.merchants.length} 家</span></h3><div class="flex flex-wrap gap-1.5">${chips}</div></div>`;
        }).join("")}
        <div>${srcLink(p.source, "官網原文")}</div>
      </div>
    </details>`).join("") + `</div>`;
}

function render() {
  const q = $("#q").value;
  $("#clear").hidden = !q;
  $("#kbd").hidden = !!q;
  const shown = new Set(visiblePlans());
  $("#nav").innerHTML = PLANS.map(p =>
    `<a href="#plan-${esc(p.id)}" class="btn shrink-0 rounded-full ${shown.has(p) ? "" : "opacity-40"}" data-variant="outline" data-size="sm" data-plan="${esc(p.name)}">${esc(p.name)}</a>`).join("");
  $("#nav").hidden = !!q.trim();
  $("#main").innerHTML = (window.ERRORS || "") + (q.trim() ? renderResults(q) : renderPlans());
  const url = new URL(location); q.trim() ? url.searchParams.set("q", q) : url.searchParams.delete("q");
  history.replaceState(null, "", url);
}

// ---------- 載入 ----------
const STALE_HOURS = 24; // 資料超過這麼久沒更新就提醒（GitHub 排程常延遲 6–10 小時，24 小時才算真的停了）
const errBox = (title, desc) => `<div class="alert mb-3" data-variant="destructive">${svg(ICON.alert)}<h2>${esc(title)}</h2><section>${esc(desc)}</section></div>`;

async function load(force) {
  $("#status").textContent = "載入中…";
  $("#refresh svg").classList.add("animate-spin");
  const bust = force ? `?t=${Date.now()}` : "";
  const getJSON = async url => {
    const r = await fetch(url + bust, { cache: force ? "no-store" : "default" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  const meta = await getJSON("data/meta.json").catch(() => null);
  const sources = [["cube", "CUBE 權益方案", parseCubeList], ["googler", "Googler 專屬方案", parseGoogler]];
  const results = await Promise.allSettled(sources.map(([key, , parse]) => getJSON(SOURCES[key].api).then(parse)));

  PLANS = []; let errors = "";
  results.forEach((r, i) => {
    const [key, label] = sources[i];
    if (r.status === "fulfilled") PLANS.push(...r.value);
    else errors += errBox(`${label} 載入失敗`, r.reason.message || r.reason);
    const m = meta?.sources?.[key];
    if (m && !m.ok) errors += errBox(`${label} 最近一次從官網更新失敗`, `顯示的是上一次成功的資料（${m.error}）`);
  });
  const d = meta?.fetched_at ? new Date(meta.fetched_at) : null;
  if (d && Date.now() - d > STALE_HOURS * 3600e3)
    errors += errBox("資料可能過期", `資料已經 ${Math.round((Date.now() - d) / 3600e3)} 小時沒更新，自動更新可能停了。`);
  window.ERRORS = errors;
  buildIndex();
  const n = INDEX.length;
  const fmt = d ? d.toLocaleString("zh-TW", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  $("#status").innerHTML = `<span class="hidden sm:inline">${PLANS.length} 個方案 · </span>${n} 筆商家 · 更新於 ${fmt}`;
  $("#refresh svg").classList.remove("animate-spin");
  render();
}

$("#refresh").onclick = () => load(true);
let timer;
$("#q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => { render(); window.scrollTo(0, 0); }, 80);
});
$("#clear").onclick = () => { $("#q").value = ""; render(); $("#q").focus(); };
["#optActive", "#optRestricted", "#optDetail"].forEach(s => $(s).addEventListener("change", render));
$("#main").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row && !e.target.closest("a")) row.classList.toggle("open");
  const chip = e.target.closest(".chip");
  if (chip) openSheet(CHIPS[+chip.dataset.k]);
});
$("#nav").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a || !$("#q").value) return;
  e.preventDefault(); $("#q").value = ""; render();       // 搜尋中點方案 → 回到總覽並跳過去
  document.querySelector(a.getAttribute("href"))?.scrollIntoView();
});
document.addEventListener("keydown", e => {
  if ($("#sheet").open) return;
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); }
});

// 商家說明面板（Basecoat dialog）
function openSheet({ plan: p, cat: c, m }) {
  $("#sheetBody").innerHTML = `
    <header>
      <h2 id="sheetTitle" class="pr-8">${esc(m.name)}</h2>
      <p><span class="font-medium text-foreground">${esc(p.name)}</span> › ${esc(c.name)}${m.group ? " · " + esc(m.group) : ""}${p.period ? `<br>${esc(p.period.label)}` : ""}</p>
    </header>
    <section class="flex flex-col gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-3xl font-bold tabular-nums text-primary">${esc(m.rate || "依等級")}</span>${restrictTag(p)}${statusTag(p)}
      </div>
      ${p.restricted ? `<div class="flex items-start gap-2 text-sm text-warn">${svg(ICON.lock, 15, "mt-0.5 shrink-0")}<span>資格：${esc(p.restricted)}</span></div>` : ""}
      <div class="whitespace-pre-line rounded-lg bg-muted/60 p-3 text-[13px] leading-relaxed text-muted-foreground">${m.detail ? esc(m.detail) : "（此商家沒有額外說明）"}</div>
    </section>
    <footer>
      <a href="${esc(p.source)}" target="_blank" rel="noopener" class="btn" data-variant="outline">查看官網原文${svg(ICON.external, 14)}</a>
      <button type="button" class="btn" data-close>關閉</button>
    </footer>
    <button type="button" class="btn absolute top-3 right-3" data-variant="ghost" data-size="icon-sm" aria-label="關閉" data-close>${svg(ICON.x)}</button>`;
  $("#sheetBody").scrollTop = 0;
  $("#sheet").showModal();
}
$("#sheet").addEventListener("click", e => {
  if (e.target === $("#sheet") || e.target.closest("[data-close]")) $("#sheet").close();  // 點背景或關閉鈕
});

// 手機：篩選收合、按「搜尋」收鍵盤
$("#filterBtn").onclick = () => {
  const on = !$("#opts").hasAttribute("data-open");
  $("#opts").toggleAttribute("data-open", on);
  $("#filterBtn").setAttribute("aria-expanded", on);
};
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") $("#q").blur(); });
// 只有桌機自動聚焦搜尋框；手機一開就跳鍵盤會擋住內容
if (matchMedia("(pointer: fine)").matches) $("#q").focus();

$("#q").value = new URL(location).searchParams.get("q") || "";
load(false);
</script>
</body>
</html>
